# Hatari: every joystick emulated on the keyboard, one key set each.
# Use: tools/hatari_run.py ... --extra "--configfile tools/hatari-joysticks.cfg"
# Keys must be sent with xdotool (hatari_run.py --key/--down/--up), not
# through the control socket or the command FIFO, which bypass the joysticks.
# Keys: up down left right fire. nJoystickMode 2 = keyboard, 0 = off.

# ST port 0 (mouse port): W S A D Q
[Joystick0]
nJoystickMode = 2
bEnableAutoFire = FALSE
bEnableJumpOnFire2 = FALSE
nJoyId = 0
kUp = W
kDown = S
kLeft = A
kRight = D
kFire = Q

# ST port 1: I K J L U
[Joystick1]
nJoystickMode = 2
bEnableAutoFire = FALSE
bEnableJumpOnFire2 = FALSE
nJoyId = 1
kUp = I
kDown = K
kLeft = J
kRight = L
kFire = U

# STE/Falcon extended port A (Jaguar pad: fire = button A): T G F H R
[Joystick2]
nJoystickMode = 2
bEnableAutoFire = FALSE
bEnableJumpOnFire2 = FALSE
nJoyId = 2
kUp = T
kDown = G
kLeft = F
kRight = H
kFire = R

# STE/Falcon extended port B: Up Down Left Right Return
[Joystick3]
nJoystickMode = 2
bEnableAutoFire = FALSE
bEnableJumpOnFire2 = FALSE
nJoyId = 3
kUp = Up
kDown = Down
kLeft = Left
kRight = Right
kFire = Return

# parallel-port adapter, joystick 3: D4-D7 + BUSY: 1 2 3 4 5
[Joystick4]
nJoystickMode = 2
bEnableAutoFire = FALSE
bEnableJumpOnFire2 = FALSE
nJoyId = 4
kUp = 1
kDown = 2
kLeft = 3
kRight = 4
kFire = 5

# parallel-port adapter, joystick 4: D0-D3 + STROBE: 6 7 8 9 0
[Joystick5]
nJoystickMode = 2
bEnableAutoFire = FALSE
bEnableJumpOnFire2 = FALSE
nJoyId = 5
kUp = 6
kDown = 7
kLeft = 8
kRight = 9
kFire = 0
